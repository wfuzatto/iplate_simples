name: Backend PHP validation
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/php-check.yml']
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Check syntax of backend PHP
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test Expresso contract without network or credentials
        run: php backend/tests/expresso-reservation-test.php
      - name: Test detail photo upload contract
        run: php backend/tests/detail-photos-test.php
      - name: Test detail linkage and append with SQL fixture
        run: php backend/tests/detail-storage-test.php
      - name: Package backend for FTP or cPanel installation
        run: |
          cd backend
          zip -q -r ../iplate-simples-backend.zip api lib bin config.php config.local.example.php db.php schema.sql migrations DEPLOY.md .htaccess
      - name: Publish backend distribution ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iplate-simples-backend
          path: iplate-simples-backend.zip
          if-no-files-found: error
